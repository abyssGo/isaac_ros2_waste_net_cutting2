vision1_debug_popup:
  ros__parameters:
    # Live camera stream. UI-only YOLO runs independently from Action targets.
    image_topic: "/camera1/rgb/image_raw"
    status_topic: "/vision1/debug/status"
    # Keep the dashboard separate from nc_vision's annotated debug image.
    output_topic: "/vision1/debug_dashboard"
    window_name: "NetClean Vision 1 - Cutting Debug"
    enable_window: true
    # Fits beside a terminal on a 1920x1080 desktop.
    window_width: 1280
    window_height: 800
    render_fps: 20.0
    live_detection_enabled: true
    model_path: models/netclean_yolo11n/weights/best.pt
    device: "0"
    model_imgsz: 640
    confidence: 0.40
    iou_threshold: 0.45
    max_detections: 3
    expected_classes: [plastic_bottle, can, buoy]
    live_detection_interval_sec: 0.10
    # ROI pixel coordinates [x1, y1, x2, y2]. [0,0,0,0] disables the line.
    roi: [0, 0, 0, 0]
    # Fill these using the labelled YOLO validation result. -1 means N/A.
    validation_precision: -1.0
    validation_recall: -1.0
    validation_map50: -1.0
    validation_map50_95: -1.0

vision2_debug_popup:
